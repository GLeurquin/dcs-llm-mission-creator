[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcs-mission-creator"
version = "0.1.0"
description = "Create DCS missions with pydcs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydcs @ git+https://github.com/pydcs/dcs.git",
  "argcomplete>=3.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "zarr>=3.0",
  "numcodecs>=0.13",
  "rasterio>=1.3",
  "shapely>=2.0",
  "requests>=2.31",
  "tenacity>=8.2",
  "elevation>=1.1",
  "matplotlib>=3.8",
  # Imported directly by core/recon; matplotlib pulls it in transitively, but a
  # dependency we import must be declared or the next lock could drop it.
  "pillow>=10.1",
  "structlog>=24.1",
  "piper-tts>=1.4.2",
]

[project.scripts]
dcs-mission-creator = "dcs_mission_creator.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dcs_mission_creator.core.lua" = ["*.lua", "vendor/*.lua", "vendor/*.txt", "vendor/*.md"]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
    "ty>=0.0.38",
    "pytest>=8.0",
    # An embedded Lua interpreter, so `tests/test_iads_runtime.py` can actually
    # *run* the vendored IADS framework against a stubbed DCS scripting
    # environment instead of only checking that the generated Lua compiles.
    # Without it that one test skips; nothing else needs it.
    "lupa>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: needs the built map overlay and/or a DCS install; skipped in CI",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["dcs_mission_creator"]
combine-as-imports = true
split-on-trailing-comma = true

