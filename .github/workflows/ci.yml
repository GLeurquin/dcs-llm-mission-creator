name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format
        run: uv run ruff format --check src/ tests/

      - name: Type-check
        run: uv run ty check src/

      # The runner has neither a DCS installation nor the multi-GB map overlay,
      # so mission generation cannot run here. Those tests are marked `slow`
      # and skip themselves; everything else must pass without either.
      - name: Test
        run: uv run pytest -m "not slow"
