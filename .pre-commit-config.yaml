# Run locally with `prek run --all-files` (or `pre-commit` if you prefer).
# Hook installed via `prek install`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty (astral static type checker)
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      # The document checks, on their own hook because they are the only tests
      # a *markdown-only* commit can break — and a markdown-only commit is
      # exactly how both mission catalogues went stale. Half a second, so it
      # runs on either kind of change rather than being conditional.
      - id: docs
        name: pytest (documents match the code)
        entry: uv run pytest -q tests/test_docs.py
        language: system
        types_or: [python, markdown]
        pass_filenames: false
        require_serial: true

      # Only the fast tests: the `slow` ones need the built map overlay, which
      # not every checkout has. CI runs the same selection.
      - id: pytest
        name: pytest (fast tests)
        entry: uv run pytest -q -m "not slow"
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
