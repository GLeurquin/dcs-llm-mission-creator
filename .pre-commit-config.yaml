# Run locally with `prek run --all-files` (or `pre-commit` if you prefer).
# Hook installed via `prek install`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty (astral static type checker)
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
